<!-- @dsCard group="Controls" height=320 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fader preview</title></head>
<body style="margin:0;background:var(--cs-bg)">
<div id="root"></div>
<script>
var UI = window.CsoundWebUI, h = React.createElement;
// shows what a widget would send to its Csound channel
function Logged(props) {
  var s = React.useState(props.initial || ""), log = s[0], setLog = s[1];
  return h("div", { className: "cs-stage" }, props.render(function (id) { return function (v) { setLog(id + " \u2192 " + JSON.stringify(v)); }; }),
    h("div", { className: "cs-log", "aria-live": "polite" }, log || "Drag or type to change a value"));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Logged, { render: function (on) { return [
  h(UI.Fader, { key: "w", label: "WGT", min: 0, max: 1, step: 0.01, defaultValue: 0.5, onChange: on("weight") }),
  h(UI.Fader, { key: "a", label: "A", unit: "s", min: 0, max: 3, step: 0.01, defaultValue: 0.01, onChange: on("adsr1_a") }),
  h(UI.Fader, { key: "s", label: "S", min: 0, max: 1, step: 0.01, defaultValue: 1, onChange: on("adsr1_s") }),
  h(UI.Fader, { key: "r", label: "R", unit: "s", min: 0, max: 1, step: 0.01, defaultValue: 0.1, onChange: on("adsr1_r") }),
  h(UI.Fader, { key: "c", label: "cutoff", unit: "Hz", min: 20, max: 20000, log: true, defaultValue: 2000, size: 5, onChange: on("cutoff") })
]; } }));
</script>
</body>
</html>
