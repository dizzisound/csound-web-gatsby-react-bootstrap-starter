<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusBadge preview</title></head>
<body style="margin:0;background:var(--cs-bg)">
<div id="root"></div>
<script>
var UI = window.CsoundWebUI, h = React.createElement;
// shows what a widget would send to its Csound channel
function Logged(props) {
  var s = React.useState(props.initial || ""), log = s[0], setLog = s[1];
  return h("div", { className: "cs-stage" }, props.render(function (id) { return function (v) { setLog(id + " \u2192 " + JSON.stringify(v)); }; }),
    h("div", { className: "cs-log", "aria-live": "polite" }, log || "Drag or type to change a value"));
}
ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "cs-stage" },
  h(UI.StatusBadge, { level: "ok", title: "Csound is running" }, "Csound"),
  h(UI.StatusBadge, { level: "warn" }, "Csound loading\u2026"),
  h(UI.StatusBadge, { level: "err", title: "Csound: compile error" }, "Csound error"),
  h(UI.StatusBadge, { level: "muted", title: "This browser has no Web MIDI" }, "MIDI unavailable")));
</script>
</body>
</html>
