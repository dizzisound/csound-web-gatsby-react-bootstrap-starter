<!-- @dsCard group="Layout" height=320 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Panel preview</title></head>
<body style="margin:0;background:var(--cs-bg)">
<div id="root"></div>
<script>
var UI = window.CsoundWebUI, h = React.createElement;
// shows what a widget would send to its Csound channel
function Logged(props) {
  var s = React.useState(props.initial || ""), log = s[0], setLog = s[1];
  return h("div", { className: "cs-stage" }, props.render(function (id) { return function (v) { setLog(id + " \u2192 " + JSON.stringify(v)); }; }),
    h("div", { className: "cs-log", "aria-live": "polite" }, log || "Drag or type to change a value"));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Logged, { render: function (on) { return [
  h(UI.Panel, { key: "m", label: "morph" },
    h(UI.Fader, { label: "WGT", min: 0, max: 1, step: 0.01, defaultValue: 0.5, onChange: on("weight") }),
    h(UI.XYPad, { minX: 0, maxX: 3.99, minY: 0, maxY: 3.99, size: 200, defaultValue: { x: 0.5, y: 0.5 }, onChange: on("xy") })),
  h(UI.Panel, { key: "a", label: "adsr", switchable: true, onSwitch: on("adsr1") },
    h(UI.Fader, { label: "A", unit: "s", min: 0, max: 3, step: 0.01, defaultValue: 0.01, onChange: on("adsr1_a") }),
    h(UI.Fader, { label: "S", min: 0, max: 1, step: 0.01, defaultValue: 1, onChange: on("adsr1_s") }))
]; } }));
</script>
</body>
</html>
