<!-- @dsCard group="Layout" height=280 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TabPanel preview</title></head>
<body style="margin:0;background:var(--cs-bg)">
<div id="root"></div>
<script>
var UI = window.CsoundWebUI, h = React.createElement;
// shows what a widget would send to its Csound channel
function Logged(props) {
  var s = React.useState(props.initial || ""), log = s[0], setLog = s[1];
  return h("div", { className: "cs-stage" }, props.render(function (id) { return function (v) { setLog(id + " \u2192 " + JSON.stringify(v)); }; }),
    h("div", { className: "cs-log", "aria-live": "polite" }, log || "Drag or type to change a value"));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Logged, { render: function (on) { return h(UI.TabPanel, { tabs: [
  { label: "osc 1", content: h(UI.Panel, null, h(UI.Knob, { label: "gain", min: 0, max: 1, defaultValue: 0.4, onChange: on("gain1") }), h(UI.Fader, { label: "cutoff", unit: "Hz", min: 20, max: 20000, log: true, height: 120, defaultValue: 2000, onChange: on("cutoff1") })) },
  { label: "osc 2", content: h(UI.Panel, null, h(UI.Knob, { label: "gain", min: 0, max: 1, defaultValue: 0.7, onChange: on("gain2") }), h(UI.Select, { label: "wave", items: [{ name: "sine", value: 0 }, { name: "saw", value: 1 }], defaultValue: 1, onChange: on("wave2") })) }
] }); } }));
</script>
</body>
</html>
