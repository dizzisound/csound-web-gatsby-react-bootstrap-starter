<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button preview</title></head>
<body style="margin:0;background:var(--cs-bg)">
<div id="root"></div>
<script>
var UI = window.CsoundWebUI, h = React.createElement;
// shows what a widget would send to its Csound channel
function Logged(props) {
  var s = React.useState(props.initial || ""), log = s[0], setLog = s[1];
  return h("div", { className: "cs-stage" }, props.render(function (id) { return function (v) { setLog(id + " \u2192 " + JSON.stringify(v)); }; }),
    h("div", { className: "cs-log", "aria-live": "polite" }, log || "Drag or type to change a value"));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(function Demo() {
  var s = React.useState("off"), osc = s[0], setOsc = s[1];
  var a = React.useState(false), started = a[0], setStarted = a[1];
  function connect() { setOsc("connecting"); setTimeout(function () { setOsc("connected"); }, 900); }
  return h("div", { className: "cs-stage" },
    h("div", { style: { display: "flex", gap: "var(--space-2)", flexWrap: "wrap", width: "100%" } },
      h(UI.Button, { icon: "save" }, "Save preset"), h(UI.Button, { icon: "load" }, "Load preset"), h(UI.Button, { icon: "keyboard" }, "Screen keyboard")),
    h("div", { style: { display: "flex", gap: "var(--space-2)", flexWrap: "wrap", alignItems: "center", width: "100%" } },
      started ? h(UI.StatusBadge, { level: "ok" }, "Audio") : h(UI.Button, { variant: "warning", onClick: function () { setStarted(true); } }, "\u25B6 Start audio"),
      h(UI.Button, { variant: osc === "connected" ? "primary" : "secondary", disabled: osc === "connecting", onClick: osc === "connected" ? function () { setOsc("off"); } : connect },
        { off: "Connect OSC", connecting: "Connecting OSC\u2026", connected: "OSC connected" }[osc])));
}));
</script>
</body>
</html>
