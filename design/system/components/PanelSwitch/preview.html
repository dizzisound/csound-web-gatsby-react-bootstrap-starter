<!doctype html>
<html>
<head><meta charset="utf-8"><title>PanelSwitch preview</title></head>
<body style="margin:0;background:var(--cs-bg)">
<div id="root"></div>
<script>
var UI = window.CsoundWebUI, h = React.createElement;
// shows what a widget would send to its Csound channel
function Logged(props) {
  var s = React.useState(props.initial || ""), log = s[0], setLog = s[1];
  return h("div", { className: "cs-stage" }, props.render(function (id) { return function (v) { setLog(id + " \u2192 " + JSON.stringify(v)); }; }),
    h("div", { className: "cs-log", "aria-live": "polite" }, log || "Drag or type to change a value"));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Logged, { render: function (on) { return [
  h(UI.Panel, { key: 1, label: "adsr", switchable: true, onSwitch: on("adsr1") }, h("span", { className: "cs-caption" }, "Click the switch")),
  h(UI.Panel, { key: 2, label: "lfo", switchable: true, defaultOn: true, onSwitch: on("lfo1_on") }, h("span", { className: "cs-caption" }, "On by default"))
]; } }));
</script>
</body>
</html>
